name: 功能建议
description: 提出新功能或改进想法
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 想解决什么问题
      description: 你遇到的实际痛点是什么？（请描述交易场景，而不只是功能名）
      placeholder: 单子超过 200 张时，一键全平偶尔会漏掉几单
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 期望的做法
      description: 你希望怎么解决？有参考实现更好
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 其他方案
      description: 你还考虑过哪些替代做法？

  - type: dropdown
    id: area
    attributes:
      label: 涉及模块
      options:
        - 快速平仓（close_all_*）
        - 交易策略（ADX/RSI 双模式）
        - 后台服务（service.py）
        - GUI（gui_dual.py）
        - 打包 / 部署
        - 其他
    validations:
      required: true

  - type: checkboxes
    id: contribute
    attributes:
      label: 参与意愿
      options:
        - label: 我愿意提交 PR 实现这个功能
