name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  syntax-check:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install MetaTrader5 pyautogui pygetwindow

      - name: Syntax check all sources
        run: |
          python -m py_compile gui_dual.py trader_dual.py service.py
          echo "All sources compile OK"
